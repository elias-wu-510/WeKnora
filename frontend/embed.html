<!DOCTYPE html>
<html lang="en">
<head>
    <title>WeKnora Embed</title>
    <script>
      /* 部署形态由 vite 注入（见 vite.config.ts 的 ckDeployHtml）；host 列表
         不再手抄。pathname 前缀兜底保留，避免 dev/静态直开时判定失效。 */
      (function () {
        var deploy = window.__CK_DEPLOY__ || {};
        var base = String(deploy.base || '').replace(/\/+$/, '');
        var hosts = deploy.hosts || [];
        var isCk = hosts.indexOf(location.hostname) !== -1 ||
          base === '/c-knowledge' || base === '/c-knowledge-test' ||
          location.pathname.indexOf('/c-knowledge/') === 0 ||
          location.pathname.indexOf('/c-knowledge-test/') === 0;
        if (isCk) document.title = 'C-Knowledge';
      })();
    </script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimal-ui">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="renderer" content="webkit">
    <link rel="shortcut icon" type="image/png" href="./public/favicon.ico"/>
    <style>
      html, body, #embed-app { height: 100%; margin: 0; }
    </style>
</head>
<body>
<script>
(function(){
  document.documentElement.setAttribute('theme-mode', 'light');
  document.documentElement.style.background = '#fff';
  document.body.style.background = '#fff';
})();
</script>
<script src="/config.js"></script>
<script src="/tdesign-icons/0.4.1/fonts/index.js"></script>
<div id="embed-app"></div>
<script type="module" src="/src/embed-main.ts"></script>
</body>
</html>
