# C-Knowledge (WeKnora) 子路径入口 -> 127.0.0.1:8082（以 base=/c-knowledge/ 构建）。
# 由 install-c-knowledge-nginx.sh 插入到 /etc/nginx/conf.d/llm-ai.c-smart.hk.conf 的
# llm-ai server 块内、catch-all location / 之前。
location = /c-knowledge {
  return 308 /c-knowledge/;
}

location /c-knowledge/ {
  client_max_body_size 200m;

  # 末尾 / 剥掉前缀：容器侧收到 /assets/...、/api/...、/files、/mcp/...
  proxy_pass http://127.0.0.1:8082/;
  proxy_http_version 1.1;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Prefix /c-knowledge;

  # SSE 流式问答 / 沙箱终端 WebSocket
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}