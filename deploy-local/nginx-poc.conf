# WeKnora POC 本地 UI 反代（用户态 nginx，端口 8081）
# 静态：/home/claw/WeKnora/web（vite 构建产物）；后端：127.0.0.1:8080
pid /home/claw/WeKnora/deploy-local/nginx.pid;
error_log /home/claw/WeKnora/deploy-local/nginx-error.log warn;
worker_processes 2;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /home/claw/WeKnora/deploy-local/nginx-access.log;
    client_body_temp_path /home/claw/WeKnora/deploy-local/tmp/body;
    proxy_temp_path /home/claw/WeKnora/deploy-local/tmp/proxy;
    fastcgi_temp_path /home/claw/WeKnora/deploy-local/tmp/fastcgi;
    uwsgi_temp_path /home/claw/WeKnora/deploy-local/tmp/uwsgi;
    scgi_temp_path /home/claw/WeKnora/deploy-local/tmp/scgi;
    sendfile on;
    client_max_body_size 50m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    server {
        listen 8081;
        server_name _;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 静态资源（带 hash，长缓存）
        location ^~ /assets/ {
            root /home/claw/WeKnora/web;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # 沙箱 WebSocket（终端/桌面）——须先于 /api/ 命中
        location ~ ^/api/v1/sessions/[^/]+/sandbox/(terminal|desktop)$ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        # 后端代理：API（含 SSE 流式设置）
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # MCP 端点（Streamable HTTP）
        location ^~ /mcp/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # 资源短链与文件
        location ^~ /r/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
        }
        location = /files {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
        }

        # SPA fallback
        location / {
            root /home/claw/WeKnora/web;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }
    }
}
