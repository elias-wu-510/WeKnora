# WeKnora 对外 HTTPS 反向代理模板（需 root 应用）
# 用法：
#   sudo cp /home/claw/WeKnora/deploy-local/nginx-weknora.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
# 前置条件：
#   1) 本机在 NAT 后（私网 10.250.0.16，出口 43.154.37.138 对外 443 不可达），
#      **不能**用 A 记录直连；必须走腾讯云 WAF/CDN（同类可用样例 dsh.c-smart.hk：
#      CNAME → *.qcloudzygj.com → 43.159.234.43，WAF 回源到本机）。
#   2) weknora.c-smart.hk 现状：CNAME → 9d27d2eb…qcloudzygj.com，该目标已无 A 记录
#      （WAF 侧条目被删/未完成），浏览器报 DNS_PROBE_FINISHED_NXDOMAIN。
#      需在腾讯云 WAF 控制台为该域名建条目，拿到新的 *.qcloudzygj.com CNAME，
#      再到 01isp DNS 面板（c-smart.hk 的权威 NS 是 ns5000.01isp.com）替换记录。
#      直接拿 Host: weknora.c-smart.hk 打 43.159.234.43 会得到
#      `HTTP/2 400 t-sec-waf: StdPortNoMatchServer`，说明 WAF 没有该域名的条目，改 CNAME 蒙混无效。
#      详细步骤见 /home/claw/reports/weknora-dedicated-subdomain-20261005.md
#   3) 云安全组无需对公网放行：WAF 回源走已有的 llm-ai/dsh 同一条链路。
#   3) 证书用仍然有效的 *.c-smart.hk 通配符：/etc/nginx/ssl/c-smart.hk-2027-02-17.{pem,key}
#      （/etc/nginx/conf.d/c-smart.hk.pem 那一份 2026-08-23 已过期，不要再引用）。
# 后端指向 frontend 容器映射的宿主端口 8081（该容器已内置 SPA 与 /api 反代）。
# 注：8082 是 base=/c-knowledge/ 的旧构建，由 llm-ai.c-smart.hk 的 /c-knowledge/ location 使用。

server {
    listen 80;
    server_name weknora.c-smart.hk;
    return 301 https://$host$request_uri;
}

server {
    # 本机 nginx 是 1.18.0：不支持 1.25+ 的 `http2 on;`，用旧写法开启 HTTP/2。
    listen 443 ssl http2;
    server_name weknora.c-smart.hk;

    ssl_certificate     /etc/nginx/ssl/c-smart.hk-2027-02-17.pem;
    ssl_certificate_key /etc/nginx/ssl/c-smart.hk-2027-02-17.key;

    client_max_body_size 50m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        # SSE / WebSocket 长连接
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }
}